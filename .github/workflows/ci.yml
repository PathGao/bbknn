name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pytest scanpy
      - name: Import
        working-directory: ${{ runner.temp }}
        run: python -c "import bbknn; print(bbknn.__version__)"
      - name: Test
        working-directory: ${{ runner.temp }}
        run: pytest "$GITHUB_WORKSPACE/tests"
